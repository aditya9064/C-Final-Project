name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --build-config Release

      - name: Download Godot 4.7
        shell: bash
        run: |
          mkdir -p godot-engine
          case "$RUNNER_OS" in
            Linux) archive=Godot_v4.7-stable_linux.x86_64.zip; binary=Godot_v4.7-stable_linux.x86_64 ;;
            macOS) archive=Godot_v4.7-stable_macos.universal.zip; binary=Godot.app/Contents/MacOS/Godot ;;
            Windows) archive=Godot_v4.7-stable_win64.exe.zip; binary=Godot_v4.7-stable_win64.exe ;;
          esac
          curl -fL "https://github.com/godotengine/godot/releases/download/4.7-stable/$archive" -o godot-engine/engine.zip
          unzip -q godot-engine/engine.zip -d godot-engine
          echo "GODOT_BIN=$PWD/godot-engine/$binary" >> "$GITHUB_ENV"

      - name: Godot import, scene, and two-process multiplayer tests
        shell: bash
        run: python tests/test_godot_processes.py "$GODOT_BIN"

  # Memory diagnostic required by the course: run the unit tests under
  # AddressSanitizer + LeakSanitizer. Linux only, because Apple clang does
  # not support LeakSanitizer and MSVC's ASan lacks leak detection.
  asan:
    name: AddressSanitizer + LeakSanitizer (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan)
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DFIRETEAM_BUILD_GODOT=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

      - name: Build tests (ASan)
        run: cmake --build build-asan --target fireteam_tests --parallel

      - name: Run tests under ASan/LSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ./build-asan/tests/fireteam_tests
